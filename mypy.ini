[mypy]
python_version = 3.9
files = db.py,llm_client.py,rag_engine.py,tools.py,memory_store.py,guardrails.py
exclude = ^(app|jarvis_core|embeddings|json_store|migrate_json_to_sqlite|test_).*\.py$
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
strict_optional = True
ignore_missing_imports = True
follow_imports = skip

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-google.genai.*]
ignore_missing_imports = True

[mypy-google_genai.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-pymupdf.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-ddgs.*]
ignore_missing_imports = True
